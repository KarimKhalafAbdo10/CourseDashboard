@if (isOpen()) {
      <!-- Backdrop -->
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm animate-in fade-in duration-200">
        <!-- Modal Card -->
        <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-2xl transition-all border border-slate-100">
          <div class="mb-4 flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-red-100 text-red-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800">{{ title() }}</h3>
          </div>

          <p class="text-sm text-slate-600 mb-6">{{ message() }}</p>

          <div class="flex justify-end gap-3">
            <button 
              type="button"
              (click)="cancel.emit()" 
              class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 transition cursor-pointer">
              Cancel
            </button>
            <button 
              type="button"
              (click)="confirm.emit()" 
              class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700 shadow-sm transition cursor-pointer">
              Delete
            </button>
          </div>
        </div>
      </div>
    }
