@if (course(); as c) {
      <div class="max-w-3xl mx-auto bg-white shadow-sm border border-gray-200 rounded-xl overflow-hidden">
        <div class="p-6 sm:p-8">
          <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <h1 class="text-3xl font-bold text-gray-900">{{ c.courseName }}</h1>
            <span [ngClass]="{
              'bg-green-100 text-green-800': c.status === 'Active',
              'bg-yellow-100 text-yellow-800': c.status === 'Draft',
              'bg-gray-100 text-gray-800': c.status === 'Archived'
            }" class="px-3 py-1 rounded-full text-sm font-medium">
              {{ c.status }}
            </span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 border-y  border-gray-100 py-6">
            <div>
              <p class="text-xs font-semibold  text-gray-400 uppercase">Instructor</p>
              <p class="text-lg font-medium text-gray-800 mt-0.5">{{ c.instructorName }}</p>
            </div>
            <div>
              <p class="text-xs font-semibold text-gray-400 uppercase">Category</p>
              <p class="text-lg font-medium text-gray-800 mt-0.5">{{ c.category }}</p>
            </div>
            <div>
              <p class="text-xs font-semibold text-gray-400 uppercase">Duration</p>
              <p class="text-lg font-medium text-gray-800 mt-0.5">{{ c.duration }} Hours</p>
            </div>
            <div>
              <p class="text-xs font-semibold text-gray-400 uppercase">Price</p>
              <p class="text-lg font-bold text-blue-600 mt-0.5">\${{ c.price }}</p>
            </div>
          </div>

          <div class="mb-8">
            <h3 class="text-sm font-semibold text-gray-400 uppercase mb-2">Description</h3>
            <p class="text-gray-600 leading-relaxed whitespace-pre-line">
              {{ c.description || 'No course overview provided.' }}
            </p>
          </div>

          <div class="flex justify-between items-center border-t border-gray-100 pt-6">
            <span class="text-xs text-gray-400">Created: {{ c.createdDate }}</span>
            <div class="space-x-3">
              <a routerLink="/courses" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 text-sm font-medium">Back</a>
              <a [routerLink]="['/courses/edit', c.id]" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium shadow-sm">Edit Course</a>
            </div>
          </div>
        </div>
      </div>
    }
